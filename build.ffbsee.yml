---
- name: Update packages and users on all nodes
  hosts: build
  become: yes
  tags:
  - base
  - users
  - base-packages
  - base_packages
  - ssh_authorized_keys
  - new-user
  - ssh
  - sshd
  - auth
  roles:
    - basic-packages
    - users
    - sshd

- name: Update packages and users on all nodes
  hosts: build
  become: yes
  tags:
  - motd
  roles:
    - motd
    - role: install-bat
      when: install_bat_enabled | default(true) | bool
