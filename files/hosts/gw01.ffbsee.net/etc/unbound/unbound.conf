include: "/etc/unbound/unbound.conf.d/*.conf"
include: "/etc/unbound/ff_stub_zones/*.conf"

remote-control:
    control-enable: no

server:
    # listen on local network, allow local network access
    interface: 127.0.0.1
    interface: 10.15.224.1
    interface: ::1
    interface: fdef:1701:b5ee:23::1
    access-control: 127.0.0.1 allow
    access-control: 10.15.224.0/20 allow
    access-control: ::1 allow
    access-control: fdef:1701:b5ee:23::/64 allow

    chroot: ""

    # logging
    log-time-ascii: yes
    log-queries: no
    verbosity: 1 

    hide-identity: yes
    hide-version: yes
   
    domain-insecure: "ffbsee"
    domain-insecure: "0.160.11.10.in-addr.arpa"

    root-hints: root.hints
