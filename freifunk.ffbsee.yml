---
# auto load vault vars
#- name: load vault vars
#  hosts: all
#  tasks:
#    - include_vars: group_vars/all_vault.yml

- hosts: all
  become: yes
  tags:
    - basic-packages
    - sshd
    - users
  roles:
    - basic-packages
    - sshd
    - users


- name: python3 as default
  hosts: all
  tags:
    - python3
    - python-is-python3
    - python3-is-python
    - python-default
    - python3-default
  roles:
    # python3_default_enabled: false (host_vars) lässt die Alternativen für
    # python/pip so, wie sie sind (z. B. gw01: keine, pip aus python3-pip).
    - role: python3-default
      when: python3_default_enabled | default(true) | bool

- name: Update packages and users on all nodes
  hosts: freifunk
  tags: 
  - motd
  roles:
    - motd
    # install_bat_enabled: false (host_vars), wenn bat als Debian-Paket kommt
    # (die Rolle installiert ein älteres .deb von GitHub).
    - role: install-bat
      when: install_bat_enabled | default(true) | bool
  tasks:
    # Hält bat (nicht batman) – gehört zum .deb aus install-bat.
    - name: Prevent batman package auto upgrade
      dpkg_selections:
        name: bat
        selection: hold
      when: install_bat_enabled | default(true) | bool

# Note: We don't do this for hosts in external datacenters
# since we may have other hosts in the future, let's keep this for now, but commented out
#- name: Configure basic network setup for gw
#  hosts:
#     - gw01.ffbsee.net
#     - gw02.ffbsee.net
#     - map.ffbsee.net
#  tags:
#  - network
#  - interfaces
#  roles:
#    - network

- name: fail2ban
  hosts: all
  tags:
    - fail2ban
  roles:
    # fail2ban_enabled: false (host_vars) lässt fail2ban, wie Debian es
    # ausliefert (z. B. gw01: nur jail.d/defaults-debian.conf, Jail sshd).
    - name: fail2ban
      when: fail2ban_enabled | default(true) | bool

- name: Configure freifunk network setup for gw
  hosts: freifunk
  tags:
  - backbone
  - fastd
  - freifunk-backbone
  - freifunk-update-script
  - fastd-install
  - fastd-config
  - wireguard
  - vxlanbackbone
  roles:
    # freifunk_backbone_enabled: false (host_vars) auf Hosts ohne Gateway-
    # Aufgaben (z. B. mate: kein radvd, batman-adv aus dem Kernel).
    - role: freifunk-backbone
      when: freifunk_backbone_enabled | default(true) | bool
    - freifunk-update-script
    - fastd-install
    # fastd_config_enabled: false (host_vars), wo die fastd-Konfiguration von
    # Hand gepflegt ist (z. B. mate: Schlüssel steht in fastd_backbone.conf).
    - role: fastd-config
      when: fastd_config_enabled | default(true) | bool
    - wireguard
    - vxlanbackbone

- name: Configure network routing for gw
  hosts: freifunk
  tags: 
  - routing
  - iptables
  - ip6tables
  - firewall
  roles:
   # firewall_enabled: false (host_vars) auf Hosts, die kein Gateway sind
   # (z. B. mate: kein NAT, nur die Regeln von fail2ban).
   - role: firewall
     when: firewall_enabled | default(true) | bool

- name: Configure network routing for gw
  hosts:
    - gw01.ffbsee.net
    - gw02.ffbsee.net
  tags: 
  - routing
  - dhcp
  - dhcpd
  - isc-dhcp
  - isc
  - isc-dhcp-server
  roles:
   - dhcpd

- name: Configure network routing for map
  hosts:
    - map.ffbsee.net
  tags: 
  - routing
  - dhcp
  - dhcpd
  - isc-dhcp
  - isc
  roles:

# Note: this is only done on gws
- name: Configure network routing for gw
  hosts:
    - gw01.ffbsee.net
    - gw02.ffbsee.net
  tags: 
  - dns
  - unbound
  - role-unbound
  - bind
  
  collections:
   - community.general
   - ansible.utils
  roles:
   - unbound
   - unbound_freifunk_tlds
   - bird

# Note: this should only be executed on one gateway
- name: Configure Intercity VPN
  hosts:
    - gw02.ffbsee.net
  tags:
  - icvpn 
  - tinc
  
  roles:
   - role: freifunk-icvpn
     when: run_icvpn == 'true'
   - role: tinc
     when: run_icvpn == 'true'

# Note: this is only done on the map server
- name: Configure web setup for gw
  hosts: map.ffbsee.net
  tags: web
  roles:
    - nginx
    - gateway-page
#    - freifunk-karte-json
#    - FFNodeList

- name: install telegraf
  hosts: all
  become: yes
  tags:
    - telegraf
  roles:
    # telegraf_enabled: false (host_vars), wo kein telegraf läuft.
    - role: telegraf
      when: telegraf_enabled | default(true) | bool


- name: install re4jh/robin-exporter
  hosts: map.ffbsee.net
  tags:
    - robin
  roles:
    - ffbsee-robin-exporter

# Opt-in: läuft nur mit --tags php-update. Aktualisiert die installierten
# PHP-Pakete und startet laufende Dienste mit PHP neu (Apache, FPM).
# Details: roles/php-update/README.md
- name: PHP update
  hosts: all
  gather_facts: false
  tags:
    - never
    - php-update
  roles:
    - php-update

# Opt-in: läuft nur mit --tags dhcpd-update. Aktualisiert isc-dhcp-server auf
# den Hosts mit freifunk_dhcp_server; der normale Lauf installiert nur.
- name: DHCP server update
  hosts: all
  gather_facts: false
  tags:
    - never
    - dhcpd-update
  tasks:
    - import_role:
        name: dhcpd
        tasks_from: update.yml
