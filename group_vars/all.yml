# Stand wie auf mate und map (2026-10-25); Abweichungen in host_vars.
accounts:
  - alex
  - kpanic
  - mart
  - raoul
  - wolf
  - xperimental

admins:
  - alex
  - kpanic
  - mart
  - raoul
  - wolf

users:
  alex:
    - alex@rsa-toolbox_rsa
    - alex@toolbox_ed25519
    - alexander@alex-g5_ed25519
  kpanic:
    - kpanic@hirnduenger.de_rsa
  mart:
    - mart@ffbsee.de_rsa
    - mart@kirika_rsa
    - mart@linux-srfv_rsa
    - mart@waldorfschule-ueberlingen.de_rsa
    - mart@archlinux_ed25519
    - mart@kirika_ed25519
  raoul:
    - raoul@ccczh_ed25519
  wolf:
    - wolf@rotkaeppchen_ed25510
  xperimental:
    - xperimental@id1_rsa
    - xperimental@id2_rsa
    - xperimental@id3_rsa
    - xperimental@id4_rsa

# fail2ban
fail2ban_maxretry: 10
fail2ban_bantime: "{{ (60 * 10) }}"
fail2ban_banaction: iptables-multiport
fail2ban_jails:
  - name: '{{ fail2ban_ssh_jail_name }}'
    enabled: 'true'

#telegraf config for all machines
telegraf_agent_package_method: online
telegraf_agent_package: /tmp/telegraf.deb
telegraf_plugins_default:
- plugin: cpu
  config:
    - percpu = true
- plugin: disk
  tags:
    - diskmetrics = true
  tagpass:
    - fstype = [ "ext4", "xfs" ]
  tagdrop:
    - path = [ "/etc", "/etc/telegraf", "/etc/hostname", "/etc/hosts", "/etc/resolv.conf" ]
- plugin: io
- plugin: mem
- plugin: system
- plugin: swap
- plugin: net
- plugin: netstat
- plugin: processes
- plugin: docker
  config:
    - endpoint = "unix:///var/run/docker.sock"
    - timeout = "5s"
telegraf_agent_output:
- type: prometheus_client
  config:
    - listen = ":9273"
    #TODO access control or public?

# prometheus stuff
#TODO access control or public?
prometheus_targets:
  node:
  - targets:
    - gw01.ffbsee.net:9273
    - gw02.ffbsee.net:9273
    - map.ffbsee.net:9273
    - map.ffbsee.net:9295
    - map.ffbsee.net:8000
    #9273 is telegraf
    #9295 is freifunk exporter


#should go through proxy - I think
grafana_address: 127.0.0.1
grafana_provisioning_synced: true
grafana_dashboard_dir: /opt/grafana/dashboards
grafana_datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    #localhost could be map here
    url: 'http://localhost:9090'
grafana_dashboards_dir: "{{ grafana_dashboard_dir }}"
grafana_users:
  allow_sign_up: true
  auto_assign_org_role: Viewer
  default_theme: dark

packages_extra:
  - git
  - git-lfs
  - ifupdown
