---
hostname: 'map.ffbsee.net'
gwnumber: '06'
  
ipv4_mesh_address: '10.15.224.6'
bat0_mac_address: '86:00:00:2c:de:52'
wireguardipaddress: 'fd42:dead:beef:4::6'
vxlanmac: '66:61:17:75:32:af'
vxlanendpoints: '\"fd42:dead:beef:4::1\" \"fd42:dead:beef:4::3\" \"fd42:dead:beef:4::4\" \"fd42:dead:beef:4::5\"'
vxlanbackbonename: 'vxbackbone'

ipv6_suffix: ':6'
ipv6_radv_suffix: ':1'
ipv6_address: '{{ ipv6_prefix }}{{ ipv6_suffix }}'
mesh_ipv6_extra_addr: ''
mesh_ipv6_address: '{{ ipv6_address }}'
ipv6_radv_address: '{{ ipv6_prefix }}{{ ipv6_radv_suffix }}'
ipv6_radv_prefix: '{{ ipv6_prefix }}:/64'

wan_ipv6_network: '2a01:4f8:c2c:9583::/64'
wan_ipv6_ip: '2a01:4f8:c2c:9583::1'
wan_base_interface: 'eth0'
wan_vlan_id: ''
wan_interface: '{{ wan_base_interface }}{% if wan_vlan_id != "" %}.{{ wan_vlan_id }}{% endif %}'
wan_ipv4_ip: '159.69.201.167'

fastd_secret_key: ''
vpn_on_port_443: 'false'

run_mesh: 'true'
run_gateway: 'false'
run_webserver: 'true'
run_icvpn: 'false'
run_map: 'true'
run_stats: 'false'
da_laueft_ein_dhcp_relay: 'false'
freifunk_dhcp_server: 'false'

fastd_vpn_backbone_configs:
  - gw01
  - gw04
fastd_peer_limit: ''

vxlantogw01: '1'
vxlantogw03: '1'
vxlantogw04: '1'
vxlantometa: '0'  

ipv6_uplink_announcen: 'false'
radv_AdvDefaultPreference: 'low'

debian: '11'
freifunk_karte_api: 'true'

nodelist: 'true'

block_rfc1918_interface: "{{ wan_base_interface }}"

# we do not host any presentations here
presentation_webserver: false

packages_extra:
  - git
  - git-lfs
  - ifupdown
  - python3-pip

number_of_cores: 1

# Basis-Pakete wie installiert (wie gw01, ohne conntrack): mtr-tiny statt mtr;
# bmon, vnstat, wireshark und glances fehlen (zögen ~95 Pakete samt GTK/Qt nach).
base_packages:
  - vim
  - curl
  - htop
  - ranger
  - nmap
  - psmisc
  - mtr-tiny
  - iftop
  - nload
  - iperf3
  - tcpdump
  - nethogs
  - arp-scan

# Backbone von Hand gepflegt: Ansible fasst batman-adv, update.sh, fastd,
# WireGuard und vxlan auf map nicht an (ein Lauf würde sie überschreiben).
freifunk_backbone_enabled: false
freifunk_update_script_enabled: false
fastd_config_enabled: false
wireguard_enabled: false
vxlanbackbone_enabled: false
# Weitere Dienste wie installiert: Ansible lässt sie auf map unverändert.
python3_default_enabled: false
install_bat_enabled: false
fail2ban_enabled: false
firewall_enabled: false
nginx_enabled: false
robin_exporter_enabled: false
telegraf_enabled: false
# fastd wie installiert, sonst würde fastd-install neu bauen.
fastd_version: 22
fastd_url: 'https://github.com/neocturne/fastd/releases/download/v22/fastd-22.tar.xz'
fastd_checksum: '19750b88705d66811b7c21b672537909c19ae6b21350688cbd1a3a54d08a8951'
