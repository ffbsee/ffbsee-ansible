---
# Installierte Version (nur lesen): gebaut wird nur, wenn sie nicht
# fastd_version ist; die Bauabhängigkeiten kommen nur dann dazu.
- name: get installed fastd version
  command: /usr/local/bin/fastd -v
  register: fastd_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: decide whether to build fastd
  set_fact:
    fastd_build: "{{ (fastd_installed.stdout | default('') | trim) != 'fastd v' ~ fastd_version }}"

- name: Install dependencies for fastd
  apt:
    name:
      - build-essential
      - meson
      - ninja-build
      - bison
      - libuecc-dev
      - libcap-dev
      - libjson-c-dev
      - libssl-dev
      - libmnl-dev
      - libsodium-dev
      - clang-format
    state: present
    update_cache: yes
    cache_valid_time: 86400
  when: fastd_build | bool

- name: Ensure download directory exists
  file:
    path: "/root/download"
    state: directory
    mode: '0755'
  when: fastd_build | bool

- name: Download fastd release tarball
  get_url:
    url: "{{ fastd_url }}"
    checksum: "sha256:{{ fastd_checksum }}"
    dest: "/root/download/fastd_{{ fastd_version }}.tar.xz"
  register: download_fastd
  when: fastd_build | bool

- name: Ensure build directory exists
  file:
    path: "{{ fastd_build_dir }}"
    state: directory
    mode: '0755'
  when:
    - fastd_build | bool
    - download_fastd.changed

- name: Unpack fastd archive
  unarchive:
    src: "/root/download/fastd_{{ fastd_version }}.tar.xz"
    dest: "{{ fastd_build_dir }}"
    remote_src: yes
  register: fastd_unpacked
  when:
    - fastd_build | bool
    - download_fastd.changed

- name: Configure fastd using Meson
  shell: |
    meson setup builddir --buildtype=release
  args:
    chdir: "{{ fastd_build_dir }}/fastd-{{ fastd_version }}"
    creates: "{{ fastd_build_dir }}/fastd-{{ fastd_version }}/builddir/build.ninja"
  when:
    - fastd_build | bool
    - fastd_unpacked.changed

- name: Build fastd using Ninja
  command: ninja -C builddir
  args:
    chdir: "{{ fastd_build_dir }}/fastd-{{ fastd_version }}"
  when:
    - fastd_build | bool
    - fastd_unpacked.changed

- name: Install fastd
  command: ninja -C builddir install
  args:
    chdir: "{{ fastd_build_dir }}/fastd-{{ fastd_version }}"
  become: yes
  when:
    - fastd_build | bool
    - fastd_unpacked.changed
