---
- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: journald retention
  ansible.builtin.template:
    src: retention.conf.j2
    dest: /etc/systemd/journald.conf.d/retention.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart journald
    - Vacuum journal
