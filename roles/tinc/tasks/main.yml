---
# tinc für das IC-VPN (Netz icvpn). Läuft nur, wenn icvpn_enabled gesetzt
# ist (Play in freifunk.ffbsee.yml). Name und Transferadressen pro Host:
# icvpn_tinc_name, icvpn_ipv4, icvpn_ipv6 (siehe icvpn-meta).

- name: Install tinc
  apt:
    name: 'tinc'
    state: present
    update_cache: yes
    cache_valid_time: 86400

- name: Copy tinc nets.boot
  copy:
    src: 'files/tinc/nets.boot'
    dest: '/etc/tinc/nets.boot'
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: Clone current icvpn hosts from github
  git:
    repo: 'https://github.com/freifunk/icvpn.git'
    dest: '/etc/tinc/icvpn'
    clone: yes
    update: yes
  register: tinc_icvpn_git

- name: Copy tinc config
  template:
    src: 'tinc.conf.j2'
    dest: '/etc/tinc/icvpn/tinc.conf'
    owner: 'root'
    group: 'root'
    mode: '0755'
  notify: Reload tinc

- name: Copy tinc-up and tinc-down
  template:
    src: '{{ item }}.j2'
    dest: '/etc/tinc/icvpn/{{ item }}'
    owner: 'root'
    group: 'root'
    mode: '0775'
  loop:
    - tinc-up
    - tinc-down
  notify: Restart tinc

# Der Hook schreibt conf.d/connects.conf aus metanodes und lädt tinc neu.
- name: Install post-merge hook
  copy:
    src: '/etc/tinc/icvpn/scripts/post-merge'
    dest: '/etc/tinc/icvpn/.git/hooks/post-merge'
    remote_src: yes
    mode: '0755'

- name: Run post-merge hook after an update
  command: /etc/tinc/icvpn/.git/hooks/post-merge
  args:
    chdir: /etc/tinc/icvpn
  when: tinc_icvpn_git is changed

- name: check if tinc private key already exists
  stat:
    path: /etc/tinc/icvpn/rsa_key.priv
  register: privkey_exists

- name: create public/private key pair for tinc
  shell: yes | tincd -n icvpn -K
  when: not privkey_exists.stat.exists

# tinc@icvpn hängt an tinc.service (WantedBy); ohne tinc.service startet
# es beim Booten nicht.
- name: Enable tinc
  systemd:
    name: '{{ item }}'
    enabled: yes
    masked: no
  loop:
    - tinc
    - tinc@icvpn

- name: Make sure tinc with icvpn is running
  systemd:
    state: started
    name: tinc@icvpn
