---
- name: check if ansible is not to old
  hosts: localhost
  tags:
   - default
  roles:
    - ansible_version
  gather_facts: no

- name: Update admin user accounts
  hosts: all
  become: yes
  tags:
   - ssh
   - access
   - default
  roles:
    - sshd
    - users

- name: Update Packages
  hosts: all
  become: yes
  tags:
   - update
  roles:
    - basic-packages
